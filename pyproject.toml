[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-engineering-orchestrator"
version = "0.1.0"
description = "A review-first, dependency-aware multi-agent engineering prototype"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "httpx>=0.27,<1.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "pytest-cov>=5.0,<7.0"]
llm = ["openai>=1.50,<3.0"]

[project.scripts]
aeo = "aeo.cli:main"

[tool.setuptools.packages.find]
include = ["aeo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
